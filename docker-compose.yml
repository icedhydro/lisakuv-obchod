services:
    app:
        build: .
        container_name: lisakuv-obchod
        ports:
            - "8000:8000"
        volumes:
            - .:/app
        working_dir: /app
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - DB_CONNECTION=sqlite
        entrypoint: ["/app/entrypoint.sh"]
